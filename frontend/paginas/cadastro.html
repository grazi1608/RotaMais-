<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaMais - Criar Conta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="tela-auth">
        <div class="cartao-auth">
            <div class="logo-auth">
                <div class="titulo">Criar conta no Rota<span class="mais">+</span></div>
                <div class="subtitulo">Leva menos de um minuto</div>
            </div>

            <form id="form-cadastro">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Ex.: João da Silva" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="123.456.789-00" required>

                <label for="cnh">CNH</label>
                <input type="text" id="cnh" placeholder="Número da CNH" required>

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="(11) 99999-9999">

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="voce@email.com" required>

                <label for="data_nascimento">Data de nascimento</label>
                <input type="date" id="data_nascimento">

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>

                <label for="confirmar_senha">Confirmar senha</label>
                <input type="password" id="confirmar_senha" placeholder="Repita a senha" required>

                <div class="acoes-formulario">
                    <button type="submit" style="width: 100%;">Criar conta</button>
                </div>
            </form>

            <p id="mensagem" class="mensagem"></p>

            <p class="link-auth">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/cadastro.js"></script>
</body>
</html>
