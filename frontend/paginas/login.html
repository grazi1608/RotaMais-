<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RotaMais - Entrar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="tela-auth">
        <div class="cartao-auth">
            <div class="logo-auth">
                <div class="titulo">Bem-vindo ao Rota<span class="mais">+</span></div>
                <div class="subtitulo">Controle financeiro para motoristas de app</div>
            </div>

            <form id="form-login">
                <label for="identificador">Telefone ou e-mail</label>
                <input type="text" id="identificador" placeholder="Digite o telefone ou e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>

                <div class="acoes-formulario">
                    <button type="submit" style="width: 100%;">Continuar</button>
                </div>
            </form>

            <p id="mensagem" class="mensagem"></p>

            <button type="button" class="botao-social" disabled title="Em breve">🔵 Conectar com o Google</button>
            <button type="button" class="botao-social" disabled title="Em breve" style="margin-top: 8px;"> Conectar com a Apple</button>

            <p class="link-auth">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
